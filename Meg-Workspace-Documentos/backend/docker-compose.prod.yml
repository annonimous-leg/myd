# Megalodon — producción industrial.
# Requiere .env.production con SECRET_KEY, POSTGRES_PASSWORD,
# SUPABASE_URL, SUPABASE_SERVICE_KEY (obligatorios -- config.py rechaza
# arrancar en producción sin ellos, ver la validación en app/config.py),
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD y OTEL_BACKEND_ENDPOINT.
#
# CORREGIDO (contra-auditoría V9): este comentario no mencionaba
# SUPABASE_URL/SUPABASE_SERVICE_KEY pese a ser las únicas variables de
# storage que el código realmente usa (app/integrations/supabase_storage.py,
# usado por BIM/documentos/firma/procurement/workers de PDF-Excel). El
# servicio `minio` de abajo SÍ se levanta pero NO está cableado a
# `api`/`worker` (no reciben ninguna variable MINIO_*/S3_*) -- queda
# como infraestructura disponible para una futura migración a storage
# self-hosted, no como el storage activo hoy. Si vas a operar en
# producción sin migrar el código de storage, puedes quitar el servicio
# `minio` de este compose sin que nada deje de funcionar.
# Requires Docker Compose >= 2.24.4 for !override port isolation.
# CORS_ALLOWED_ORIGINS must be a JSON array of exact HTTPS origins.
# Preserve the effective historical ENCRYPTION_MASTER_KEY before any key rewrap.
# External database/Redis URLs are supported; local services remain present.
version: "3.9"

services:
  db:
    ports: !override []
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: megalodon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: megalodon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megalodon -d megalodon"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    ports: !override []
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  minio:
    ports: !override []
    # No cableado a `api`/`worker` -- ver comentario al inicio de este
    # archivo. El storage activo hoy es Supabase
    # (app/integrations/supabase_storage.py). Este servicio queda
    # disponible como opción para una futura migración a storage
    # self-hosted; si no vas a migrar, puedes quitarlo.
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_BACKEND_ENDPOINT: ${OTEL_BACKEND_ENDPOINT}
      OTEL_BACKEND_AUTH_HEADER: ${OTEL_BACKEND_AUTH_HEADER:-}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set a separate MIGRATION_DATABASE_URL with DDL privileges}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      BIM_STORAGE_PROVIDER: supabase
      ENVIRONMENT: production
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  release-gate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      BIM_STORAGE_PROVIDER: supabase
      ENVIRONMENT: production
    command: python scripts/procurement_release_gate.py
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      IFC_MAX_FILE_SIZE_MB: ${IFC_MAX_FILE_SIZE_MB:-100}
      BIM_STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      ADSBEXCHANGE_API_KEY: ${ADSBEXCHANGE_API_KEY:-}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      OPENSKY_USER: ${OPENSKY_USER:-}
      OPENSKY_PASS: ${OPENSKY_PASS:-}
      WEBODM_URL: ${WEBODM_URL:-}
      WEBODM_TOKEN: ${WEBODM_TOKEN:-}
      # Fotogrametría (WebODM) es una capacidad externa OPCIONAL -- ver
      # app/main.py::_capability("photogrammetry", ...), que degrada a
      # CONFIG_REQUIRED (no crashea) si no se define. WebODM no es un
      # solo contenedor embebible aquí: es su propio stack (webapp +
      # NodeODM + Postgres + broker), normalmente desplegado aparte con
      # el docker-compose oficial de opendronemap/webodm. Si ya tienes
      # esa instancia corriendo, apunta aquí a su URL pública/interna;
      # si no, deja ambas comentadas y la capacidad queda simplemente
      # no configurada (contra-auditoría V9: antes, sin WEBODM_URL, el
      # cliente le pegaba en silencio a http://localhost:8000 -- el
      # propio puerto de este contenedor -- corregido en webodm_client.py
      # para fallar de forma explícita en vez de eso).
      # WEBODM_URL: https://webodm.tu-dominio.example
      # WEBODM_TOKEN: ${WEBODM_TOKEN}
    volumes:
      - ${FIEL_TRUST_BUNDLE_DIR:-./fiel-trust}:/run/megalodon/fiel-trust:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    # Expose only to a host-level TLS reverse proxy; /metrics is unauthenticated.
    # Do not bind the application API to every host interface.
    ports: !override
      - "127.0.0.1:${MEGALODON_API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      release-gate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  worker: &worker_base
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      BIM_STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ENVIRONMENT: production
    volumes:
      - ${FIEL_TRUST_BUNDLE_DIR:-./fiel-trust}:/run/megalodon/fiel-trust:ro
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4 -Q celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      release-gate:
        condition: service_completed_successfully

  ifc-worker:
    <<: *worker_base
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=1 -Q megalodon-ifc -n ifc@%h
    mem_limit: ${IFC_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${IFC_WORKER_CPU_LIMIT:-1.0}

  job-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      IFC_DEDICATED_QUEUE: "true"
      IFC_PROCESSING_TIMEOUT_SECONDS: ${IFC_PROCESSING_TIMEOUT_SECONDS:-300}
      BIM_STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ENVIRONMENT: production
    command: python -m app.workers.job_dispatcher
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      release-gate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the runtime DML PostgreSQL connection}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the application}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set the effective document encryption master key before starting}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to a JSON array of exact HTTPS origins}
      FIEL_TRUST_ROOT_PATHS: ${FIEL_TRUST_ROOT_PATHS:-[]}
      FIEL_INTERMEDIATE_CERT_PATHS: ${FIEL_INTERMEDIATE_CERT_PATHS:-[]}
      FIEL_ALLOW_REVOCATION_FETCHING: ${FIEL_ALLOW_REVOCATION_FETCHING:-false}
      TSA_ALLOWED_URLS: ${TSA_ALLOWED_URLS:-[]}
      BIM_STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ENVIRONMENT: production
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      release-gate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
